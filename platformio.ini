; PlatformIO project for ESP32-C3 SuperMini + BME280 APRS WX station

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-C3 SuperMini uses the native USB peripheral for Serial (no
; separate USB-UART chip), so CDC-on-boot must be enabled or the
; serial console will not come up.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; BMP280 support is included as a fallback: many cheap modules sold as
; "BME280" are actually BMP280 (no humidity channel). The firmware detects
; the real chip ID at runtime and uses whichever is present.
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
